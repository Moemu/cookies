openapi: 3.1.0
info:
  title: cookies Strategy API
  version: 1.0.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: Project-scoped Strategy MVP API. Organization scope always comes from trusted identity.
servers:
  - url: /
security:
  - cookiesAuth: []
paths:
  /api/strategy/v1/projects/{project_id}/creative-businesses:
    get:
      operationId: listStrategyCreativeBusinesses
      summary: List the current immutable Strategy-owned creative business catalog.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Current business profiles and a catalog hash used for optimistic selection.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [catalog_hash, items]
                properties:
                  catalog_hash: {$ref: '#/components/schemas/SHA256'}
                  items:
                    type: array
                    items: {$ref: '../contracts/strategy-creative-business-profile-v1.schema.json'}
                additionalProperties: false
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/creative-businesses/{business_code}:
    get:
      operationId: getStrategyCreativeBusiness
      summary: Read one current creative business profile.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/BusinessCode'}
      responses:
        '200':
          description: One immutable business profile.
          content:
            application/json:
              schema: {$ref: '../contracts/strategy-creative-business-profile-v1.schema.json'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/creative-business-recommendations:
    post:
      operationId: recommendStrategyCreativeBusinesses
      summary: Rank current business profiles deterministically from a confirmed BriefVersion.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief_id, brief_version]
              properties:
                brief_id: {type: string, minLength: 1}
                brief_version: {type: integer, minimum: 1}
                limit: {type: integer, minimum: 1, maximum: 3, default: 3}
              additionalProperties: false
      responses:
        '200':
          description: Evidence-gated recommendations plus the exact Brief and media signals used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreativeBusinessRecommendationSnapshot'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/creative-task-plans:
    get:
      operationId: listStrategyCreativeTaskPlans
      summary: List task plans, optionally scoped to one Brief.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: brief_id, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createStrategyCreativeTaskPlan
      summary: Freeze one user-selected business, its recommendation snapshot, Brief, optional Strategy revision, profile, and Skill.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief_id, brief_version, business_code, selection_source, catalog_hash]
              properties:
                brief_id: {type: string, minLength: 1}
                brief_version: {type: integer, minimum: 1}
                source_strategy:
                  type: object
                  required: [strategy_id, revision]
                  properties:
                    strategy_id: {type: string, minLength: 1}
                    revision: {type: integer, minimum: 1}
                  additionalProperties: false
                business_code: {type: string, minLength: 1}
                selection_source: {enum: [recommended, manual]}
                catalog_hash: {$ref: '#/components/schemas/SHA256'}
              additionalProperties: false
      responses:
        '201':
          description: Newly created plan.
          content:
            application/json:
              schema: {$ref: '../contracts/strategy-creative-task-plan-v1.schema.json'}
        '409': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/creative-task-plans/{plan_id}:
    get:
      operationId: getStrategyCreativeTaskPlan
      summary: Read a task plan with its frozen profile and current generated strategy.
      parameters: [{$ref: '#/components/parameters/PlanID'}]
      responses:
        '200':
          description: Current mutable plan aggregate.
          content:
            application/json:
              schema: {$ref: '../contracts/strategy-creative-task-plan-v1.schema.json'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/creative-task-plans/{plan_id}/answers:
    patch:
      operationId: patchStrategyCreativeTaskPlanAnswers
      summary: Patch only business-specific incremental answers with optimistic concurrency.
      parameters:
        - {$ref: '#/components/parameters/PlanID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, operations]
              properties:
                expected_version: {type: integer, minimum: 1}
                operations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [op, question_id]
                    properties:
                      op: {enum: [set, remove]}
                      question_id: {type: string, minLength: 1}
                      value: {}
                    additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: {$ref: '../contracts/strategy-creative-task-plan-v1.schema.json'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/creative-task-plans/{plan_id}:generate':
    post:
      operationId: generateStrategyCreativeTaskStrategy
      summary: Queue generation of an immutable creative-task-strategy/v1.
      parameters:
        - {$ref: '#/components/parameters/PlanID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, expected_revision]
              properties:
                expected_version: {type: integer, minimum: 1}
                expected_revision: {type: integer, minimum: 1}
              additionalProperties: false
      responses:
        '202': {$ref: '#/components/responses/JSONResource'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/creative-task-plans/{plan_id}/strategy-versions:
    get:
      operationId: listStrategyCreativeTaskStrategyVersions
      summary: List immutable task strategy versions for a plan.
      parameters: [{$ref: '#/components/parameters/PlanID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
  /api/strategy/v1/creative-task-plans/{plan_id}/strategy-versions/{version}:
    get:
      operationId: getStrategyCreativeTaskStrategyVersion
      summary: Read one immutable task strategy version.
      parameters:
        - {$ref: '#/components/parameters/PlanID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Immutable strategy version envelope.
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, version, document, content_hash]
                properties:
                  plan_id: {type: string}
                  version: {type: integer, minimum: 1}
                  document: {$ref: '../contracts/strategy-creative-task-strategy-v1.schema.json'}
                  content_hash: {$ref: '#/components/schemas/SHA256'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/creative-task-plans/{plan_id}/strategy-versions/{version}/export.md:
    get:
      operationId: exportStrategyCreativeTaskStrategyMarkdown
      summary: Export one immutable task strategy as human-readable Markdown.
      parameters:
        - {$ref: '#/components/parameters/PlanID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Markdown task strategy export.
          content:
            text/markdown:
              schema: {type: string}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/workspaces:
    post:
      operationId: createStrategyWorkspace
      summary: Create an active Strategy workspace.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 255}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/workspaces:
    get:
      operationId: listStrategyWorkspaces
      summary: List workspaces in an authorized project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/generation-readiness:
    get:
      operationId: getStrategyGenerationReadiness
      summary: Preflight the configured Strategy text route without invoking a model.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/brief-versions:
    get:
      operationId: listProjectStrategyBriefVersions
      summary: List immutable confirmed Brief versions available to downstream Creative work.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/workspaces/{workspace_id}:
    get:
      operationId: getStrategyWorkspace
      summary: Read one workspace.
      parameters: [{$ref: '#/components/parameters/WorkspaceID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/conversations:
    post:
      operationId: createStrategyConversation
      summary: Create a conversation, task, and empty Brief draft.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, workspace_id]
              properties:
                project_id: {type: string, minLength: 1}
                workspace_id: {type: string, minLength: 1}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/conversations/{conversation_id}:
    get:
      operationId: getStrategyConversation
      summary: Read one conversation.
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/conversations/{conversation_id}/memory:
    get:
      operationId: getStrategyConversationMemory
      summary: Read the persisted summary and unresolved high-impact questions.
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/conversations/{conversation_id}/messages:
    get:
      operationId: listStrategyMessages
      summary: List append-only conversation messages.
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createStrategyMessage
      summary: Append a user message and queue Brief extraction.
      parameters:
        - {$ref: '#/components/parameters/ConversationID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 65536}
              additionalProperties: false
      responses:
        '202': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/conversations/{conversation_id}/events:
    get:
      operationId: streamStrategyEvents
      summary: Replay and stream durable conversation events.
      parameters:
        - {$ref: '#/components/parameters/ConversationID'}
        - name: Last-Event-ID
          in: header
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/agent-tasks/{agent_task_id}:
    get:
      operationId: getStrategyAgentTask
      summary: Read durable Agent and runtime progress.
      parameters: [{$ref: '#/components/parameters/AgentTaskID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/agent-tasks/{agent_task_id}:cancel':
    post:
      operationId: cancelStrategyAgentTask
      summary: Request cancellation with optimistic concurrency.
      parameters: [{$ref: '#/components/parameters/AgentTaskID'}]
      requestBody: {$ref: '#/components/requestBodies/ExpectedVersion'}
      responses:
        '202': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/tasks/{task_id}:
    get:
      operationId: getStrategyTask
      summary: Read the durable Strategy task aggregate.
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/tasks/{task_id}/brief-draft:
    get:
      operationId: getStrategyBriefDraft
      summary: Read the mutable Brief draft.
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchStrategyBriefDraft
      summary: Apply an allowlisted user Brief patch.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../contracts/strategy-brief-patch-v1.schema.json'}
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/tasks/{task_id}/brief:confirm':
    post:
      operationId: confirmStrategyBrief
      summary: Confirm an immutable Brief version.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/ExpectedVersion'}
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/briefs/{brief_id}/versions:
    get:
      operationId: listStrategyBriefVersions
      summary: List immutable Brief versions.
      parameters: [{$ref: '#/components/parameters/BriefID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/briefs/{brief_id}/versions/{version}:
    get:
      operationId: getStrategyBriefVersion
      summary: Read one immutable Brief version.
      parameters:
        - {$ref: '#/components/parameters/BriefID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/tasks/{task_id}/strategies:
    post:
      operationId: createStrategyDraft
      summary: Queue generation from an explicit Brief version.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief_id, brief_version]
              properties:
                brief_id: {type: string, minLength: 1}
                brief_version: {type: integer, minimum: 1}
              additionalProperties: false
      responses:
        '202': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-drafts/{strategy_id}:
    get:
      operationId: getStrategyDraft
      summary: Read a Strategy draft and its current revision.
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchStrategyDraft
      summary: Create a revision from an allowlisted section patch.
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../contracts/strategy-section-patch-v1.schema.json'}
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/agent-tasks/{agent_task_id}/skill-runs:
    get:
      operationId: listStrategySkillRuns
      summary: List safe, user-visible Skill and compliance execution metadata.
      parameters: [{$ref: '#/components/parameters/AgentTaskID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-drafts/{strategy_id}/revisions:
    get:
      operationId: listStrategyDraftRevisions
      summary: List immutable revisions of a Strategy draft.
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-drafts/{strategy_id}/generation-metadata:
    get:
      operationId: getStrategyGenerationMetadata
      summary: Read safe model, Prompt, Skill, token, and quality metadata for the latest revision.
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-drafts/{strategy_id}/revisions/{revision}:
    get:
      operationId: getStrategyDraftRevision
      summary: Read one immutable Strategy revision.
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - {$ref: '#/components/parameters/Revision'}
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/strategy-drafts/{strategy_id}:revise':
    post:
      operationId: reviseStrategyDraft
      summary: Queue a natural-language revision.
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, base_revision, instruction]
              properties:
                expected_version: {type: integer, minimum: 1}
                base_revision: {type: integer, minimum: 1}
                instruction: {type: string, minLength: 1, maxLength: 4096}
              additionalProperties: false
      responses:
        '202': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/strategy-drafts/{strategy_id}:submit':
    post:
      operationId: submitStrategyDraft
      summary: Freeze a review candidate.
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, candidate_revision]
              properties:
                expected_version: {type: integer, minimum: 1}
                candidate_revision: {type: integer, minimum: 1}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/strategy-drafts/{strategy_id}:approve':
    post:
      operationId: approveStrategyDraft
      summary: Atomically approve and publish a Strategy package.
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_id, candidate_content_hash, expected_version]
              properties:
                review_id: {type: string, minLength: 1}
                candidate_content_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                expected_version: {type: integer, minimum: 1}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  '/api/strategy/v1/strategy-reviews/{review_id}:return':
    post:
      operationId: returnStrategyReview
      summary: Return a review with a required reason.
      parameters: [{$ref: '#/components/parameters/ReviewID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 16384}
              additionalProperties: false
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-reviews/{review_id}:
    get:
      operationId: getStrategyReview
      summary: Read a review and its immutable candidate.
      parameters: [{$ref: '#/components/parameters/ReviewID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/strategy-reviews/{review_id}/comments:
    get:
      operationId: listStrategyReviewComments
      summary: List append-only comments for a Strategy review.
      parameters: [{$ref: '#/components/parameters/ReviewID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createStrategyReviewComment
      summary: Append a review comment.
      parameters: [{$ref: '#/components/parameters/ReviewID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 16384}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/strategy-packages:
    get:
      operationId: listStrategyPackages
      summary: List published package versions.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/feedback:
    get:
      operationId: listStrategyFeedback
      summary: List feedback for an exact Strategy revision or package version.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: target_type, in: query, required: true, schema: {enum: [strategy_revision, strategy_package]}}
        - {name: target_id, in: query, required: true, schema: {type: string}}
        - {name: target_version, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {$ref: '#/components/responses/JSONList'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createStrategyFeedback
      summary: Append outcome feedback to an exact immutable Strategy target.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, target_version, rating, comment]
              properties:
                target_type: {enum: [strategy_revision, strategy_package]}
                target_id: {type: string, minLength: 1}
                target_version: {type: integer, minimum: 1}
                rating: {enum: [useful, partly_useful, not_useful]}
                comment: {type: string, maxLength: 2000}
              additionalProperties: false
      responses:
        '201': {$ref: '#/components/responses/JSONResource'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/strategy-packages/{package_id}/versions/{version}:
    get:
      operationId: getStrategyPackageVersion
      summary: Read the immutable cross-module Strategy package.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/PackageID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Immutable package snapshot.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '../contracts/strategy-package-v1.schema.json'}
                  - {$ref: '../contracts/strategy-package-v2.schema.json'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/strategy-packages/{package_id}/versions/{version}/creative-handoff:
    get:
      operationId: getStrategyCreativeHandoff
      summary: Read the immutable Creative projection frozen with a Strategy package version.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/PackageID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Immutable Strategy to Creative handoff.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../contracts/strategy-creative-handoff-v1.schema.json'
        '304':
          description: The caller already has the current immutable handoff.
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/strategy/v1/projects/{project_id}/strategy-packages/{package_id}/versions/{version}/export.md:
    get:
      operationId: exportStrategyPackageMarkdown
      summary: Export an immutable package as Markdown.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/PackageID'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '200':
          description: Markdown package export.
          content:
            text/markdown:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string}
    ProjectID: {name: project_id, in: path, required: true, schema: {type: string, minLength: 1}}
    WorkspaceID: {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
    ConversationID: {name: conversation_id, in: path, required: true, schema: {type: string, minLength: 1}}
    AgentTaskID: {name: agent_task_id, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskID: {name: task_id, in: path, required: true, schema: {type: string, minLength: 1}}
    BriefID: {name: brief_id, in: path, required: true, schema: {type: string, minLength: 1}}
    StrategyID: {name: strategy_id, in: path, required: true, schema: {type: string, minLength: 1}}
    ReviewID: {name: review_id, in: path, required: true, schema: {type: string, minLength: 1}}
    PackageID: {name: package_id, in: path, required: true, schema: {type: string, minLength: 1}}
    BusinessCode: {name: business_code, in: path, required: true, schema: {type: string, minLength: 1}}
    PlanID: {name: plan_id, in: path, required: true, schema: {type: string, minLength: 1}}
    Version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    Revision: {name: revision, in: path, required: true, schema: {type: integer, minimum: 1}}
  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_version]
            properties:
              expected_version: {type: integer, minimum: 1}
            additionalProperties: false
  responses:
    JSONResource:
      description: JSON resource.
      content:
        application/json:
          schema: {type: object}
    JSONList:
      description: JSON resource list.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: {type: array, items: {type: object}}
            additionalProperties: false
    Problem:
      description: Stable API problem.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, request_id, retryable]
                properties:
                  code: {type: string}
                  message: {type: string}
                  request_id: {type: string}
                  retryable: {type: boolean}
                  details: {type: array, items: {type: object}}
            additionalProperties: false
  schemas:
    SHA256:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    AssetVersionRef:
      type: object
      additionalProperties: false
      required: [asset_id, version]
      properties:
        asset_id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
    CreativeMediaInput:
      type: object
      additionalProperties: false
      required: [asset_ref, role, origin, kind, status, usefulness, strategy_uses, observations, limitations]
      properties:
        asset_ref: {$ref: '#/components/schemas/AssetVersionRef'}
        role: {type: string}
        origin: {type: string}
        kind: {type: string}
        mime_type: {type: string}
        status: {type: string}
        width_pixels: {type: integer, minimum: 0}
        height_pixels: {type: integer, minimum: 0}
        duration_seconds: {type: number, minimum: 0}
        usefulness: {enum: [semantic, production_only, unavailable]}
        strategy_uses: {type: array, items: {type: string}}
        observations: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
    CreativeMediaAssessment:
      type: object
      additionalProperties: false
      required: [items, semantic_count, production_only_count, unavailable_count, warnings]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CreativeMediaInput'}}
        semantic_count: {type: integer, minimum: 0}
        production_only_count: {type: integer, minimum: 0}
        unavailable_count: {type: integer, minimum: 0}
        warnings: {type: array, items: {type: string}}
    CreativeBusinessRecommendation:
      type: object
      additionalProperties: false
      required: [business_code, display_name, score, eligible, confidence, reasons, missing_signals, warnings, exclusion_reasons, profile_ref]
      properties:
        business_code: {type: string}
        display_name: {type: string}
        rank: {type: integer, minimum: 1}
        score: {type: integer}
        eligible: {type: boolean}
        confidence: {enum: [high, medium, low]}
        reasons: {type: array, items: {type: string}}
        missing_signals: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        exclusion_reasons: {type: array, items: {type: string}}
        profile_ref: {type: object}
    CreativeBusinessRecommendationSnapshot:
      type: object
      additionalProperties: false
      required: [policy_version, catalog_hash, brief_id, brief_version, brief_hash, signals, media, recommended, alternatives]
      properties:
        policy_version: {type: string}
        catalog_hash: {$ref: '#/components/schemas/SHA256'}
        brief_id: {type: string}
        brief_version: {type: integer, minimum: 1}
        brief_hash: {$ref: '#/components/schemas/SHA256'}
        signals:
          type: object
          additionalProperties: false
          required: [objective_type, channels, deliverable_type, deliverable_types, industry, asset_roles, reference_present, content_context, brand_goal, product_image_count, product_video_count, analyzed_asset_count]
          properties:
            objective_type: {type: string}
            channels: {type: array, items: {type: string}}
            deliverable_type: {type: string}
            deliverable_types: {type: array, items: {type: string}}
            industry: {type: string}
            asset_roles: {type: array, items: {type: string}}
            reference_present: {type: boolean}
            content_context: {type: string}
            brand_goal: {type: boolean}
            product_image_count: {type: integer, minimum: 0}
            product_video_count: {type: integer, minimum: 0}
            analyzed_asset_count: {type: integer, minimum: 0}
        media: {$ref: '#/components/schemas/CreativeMediaAssessment'}
        recommended: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/CreativeBusinessRecommendation'}}
        alternatives: {type: array, items: {$ref: '#/components/schemas/CreativeBusinessRecommendation'}}
