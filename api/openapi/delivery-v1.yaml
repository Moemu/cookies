openapi: 3.1.0
info:
  title: cookies Delivery API
  version: 0.1.0
  description: >-
    Project-scoped DeliveryPlan draft lifecycle and server-authoritative
    preflight checks. This version is mock-only; every successful response
    explicitly identifies source=mock and a scenario.
servers:
  - url: /
security:
  - cookiesAuth: []
paths:
  /api/delivery/v1/plans:
    get:
      operationId: listDeliveryPlans
      summary: List DeliveryPlan drafts owned by one authorized Project.
      x-required-scope: delivery.plan.read
      parameters:
        - name: project_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Project-scoped plan list with explicit mock provenance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlanList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createDeliveryPlan
      summary: Persist a new mock DeliveryPlan draft and immutable V1.
      x-required-scope: delivery.plan.write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDeliveryPlanRequest'}
            example:
              project_id: project_local
              name: 销售线索增长计划
              objective: 获取高质量销售线索
              advertiser:
                id: mock-advertiser-001
                name: Cookies Mock 广告主
                platform: ocean_engine
              budget: {total_minor: 300000, currency: CNY}
              schedule:
                start_at: '2026-08-01T00:00:00Z'
                end_at: '2026-08-31T00:00:00Z'
                timezone: Asia/Shanghai
              tracking:
                landing_page: https://demo.cookies.local/lead
                pixel_id: PX-MOCK-LEAD
                conversion_event: lead_submit
              creative_references:
                - {asset_id: asset_mock_1, version: 1, confirmed: true}
              source_strategy_version: strategy-v1
      responses:
        '201':
          description: DeliveryPlan created.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/delivery/v1/plans/{plan_id}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ProjectIDQuery'
    get:
      operationId: getDeliveryPlan
      summary: Return an authorized plan with its current and immutable versions.
      x-required-scope: delivery.plan.read
      responses:
        '200':
          description: DeliveryPlan detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlan'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateDeliveryPlan
      summary: Create the next immutable version using optimistic concurrency.
      description: A stale expected_version is rejected with VERSION_CONFLICT (409).
      x-required-scope: delivery.plan.write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDeliveryPlanRequest'}
      responses:
        '200':
          description: Updated DeliveryPlan with its new current version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/delivery/v1/plans/{plan_id}/versions:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ProjectIDQuery'
    get:
      operationId: listDeliveryPlanVersions
      summary: List immutable versions for an authorized DeliveryPlan.
      x-required-scope: delivery.plan.read
      responses:
        '200':
          description: Immutable version list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlanVersionList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/delivery/v1/plans/{plan_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
      - $ref: '#/components/parameters/ProjectIDQuery'
    get:
      operationId: getDeliveryPlanVersion
      summary: Return one immutable DeliveryPlan version.
      x-required-scope: delivery.plan.read
      responses:
        '200':
          description: Immutable DeliveryPlan version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPlanVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/delivery/v1/plans/{plan_id}/preflight:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ProjectIDQuery'
    post:
      operationId: preflightDeliveryPlan
      summary: Run server-authoritative preflight checks against the current version.
      description: >-
        Failed error checks block the plan. Failed warning checks remain visible
        and repairable without making blocked=true.
      x-required-scope: delivery.plan.write
      responses:
        '200':
          description: Server-authoritative preflight result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreflightResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    cookiesAuth:
      type: apiKey
      in: cookie
      name: cookies_session
  parameters:
    ProjectIDQuery:
      name: project_id
      in: query
      required: true
      description: Active Project context; it must match the plan's immutable ownership.
      schema: {type: string, minLength: 1}
    PlanID:
      name: plan_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionNumber:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    InvalidRequest:
      description: Request fields do not satisfy the contract.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalid:
              value:
                error: {code: INVALID_REQUEST, message: The plan draft does not satisfy the API contract., request_id: request_123, retryable: false, details: [], help_url: null}
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ProjectAccessDenied:
      description: The caller cannot access the plan's Project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            denied:
              value:
                error: {code: PROJECT_ACCESS_DENIED, message: Access to the plan's Project is denied., request_id: request_123, retryable: false, details: [], help_url: null}
    ResourceNotFound:
      description: The organization-scoped plan or version does not exist.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    VersionConflict:
      description: The optimistic concurrency version is stale.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            stale:
              value:
                error: {code: VERSION_CONFLICT, message: The submitted expected version is stale., request_id: request_123, retryable: false, details: [], help_url: null}
    InternalError:
      description: The service could not complete the request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Source:
      type: string
      enum: [mock]
    Scenario:
      type: string
      enum: [golden_path, budget_zero, creative_unconfirmed, tracking_missing, incomplete_draft, project_plan_list]
    AdvertiserInput:
      type: object
      required: [id, name, platform]
      properties:
        id: {type: string}
        name: {type: string}
        platform: {type: string, enum: [ocean_engine]}
      additionalProperties: false
    MockAdvertiser:
      allOf:
        - $ref: '#/components/schemas/AdvertiserInput'
        - type: object
          required: [source, scenario]
          properties:
            source: {$ref: '#/components/schemas/Source'}
            scenario: {$ref: '#/components/schemas/Scenario'}
      unevaluatedProperties: false
    Budget:
      type: object
      required: [total_minor, currency]
      properties:
        total_minor: {type: integer, minimum: 0, description: Amount in fen.}
        currency: {type: string, enum: [CNY]}
      additionalProperties: false
    Schedule:
      type: object
      required: [start_at, end_at, timezone]
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1}
      additionalProperties: false
    Tracking:
      type: object
      required: [landing_page, pixel_id, conversion_event]
      properties:
        landing_page: {type: string}
        pixel_id: {type: string}
        conversion_event: {type: string}
      additionalProperties: false
    CreativeReference:
      type: object
      required: [asset_id, version, confirmed]
      properties:
        asset_id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        confirmed: {type: boolean}
      additionalProperties: false
    PlanDraftInput:
      type: object
      required: [name, objective, advertiser, budget, schedule, tracking, creative_references, source_strategy_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        objective: {type: string, minLength: 1, maxLength: 2000}
        advertiser: {$ref: '#/components/schemas/AdvertiserInput'}
        budget: {$ref: '#/components/schemas/Budget'}
        schedule: {$ref: '#/components/schemas/Schedule'}
        tracking: {$ref: '#/components/schemas/Tracking'}
        creative_references:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/CreativeReference'}
        source_strategy_version: {type: string}
    CreateDeliveryPlanRequest:
      allOf:
        - $ref: '#/components/schemas/PlanDraftInput'
        - type: object
          required: [project_id]
          properties:
            project_id: {type: string, minLength: 1}
      unevaluatedProperties: false
    UpdateDeliveryPlanRequest:
      allOf:
        - $ref: '#/components/schemas/PlanDraftInput'
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, minimum: 1}
      unevaluatedProperties: false
    Principal:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [user, service]}
        id: {type: string}
      additionalProperties: false
    DeliveryPlanVersion:
      type: object
      required:
        - plan_id
        - organization_id
        - project_id
        - version_number
        - name
        - objective
        - advertiser
        - budget
        - schedule
        - tracking
        - creative_references
        - source_strategy_version
        - source
        - scenario
        - created_by
        - created_at
      properties:
        plan_id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        version_number: {type: integer, minimum: 1}
        name: {type: string}
        objective: {type: string}
        advertiser: {$ref: '#/components/schemas/MockAdvertiser'}
        budget: {$ref: '#/components/schemas/Budget'}
        schedule: {$ref: '#/components/schemas/Schedule'}
        tracking: {$ref: '#/components/schemas/Tracking'}
        creative_references:
          type: array
          items: {$ref: '#/components/schemas/CreativeReference'}
        source_strategy_version: {type: string}
        source: {$ref: '#/components/schemas/Source'}
        scenario: {$ref: '#/components/schemas/Scenario'}
        created_by: {$ref: '#/components/schemas/Principal'}
        created_at: {type: string, format: date-time}
      additionalProperties: false
    DeliveryPlan:
      type: object
      required:
        - id
        - organization_id
        - project_id
        - status
        - platform
        - source
        - scenario
        - current_version_number
        - current_version
        - versions
        - created_by
        - created_at
        - updated_at
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        status: {type: string, enum: [draft]}
        platform: {type: string, enum: [ocean_engine_mock]}
        source: {$ref: '#/components/schemas/Source'}
        scenario: {$ref: '#/components/schemas/Scenario'}
        current_version_number: {type: integer, minimum: 1}
        current_version: {$ref: '#/components/schemas/DeliveryPlanVersion'}
        versions:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DeliveryPlanVersion'}
        created_by: {$ref: '#/components/schemas/Principal'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    DeliveryPlanList:
      type: object
      required: [items, source, scenario]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DeliveryPlan'}
        source: {$ref: '#/components/schemas/Source'}
        scenario: {type: string, const: project_plan_list}
      additionalProperties: false
    DeliveryPlanVersionList:
      type: object
      required: [items, source, scenario]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DeliveryPlanVersion'}
        source: {$ref: '#/components/schemas/Source'}
        scenario: {$ref: '#/components/schemas/Scenario'}
      additionalProperties: false
    RepairTarget:
      type: object
      required: [field, section, label]
      properties:
        field: {type: string}
        section: {type: string}
        label: {type: string}
      additionalProperties: false
    PreflightCheck:
      type: object
      required: [code, severity, passed, message, repair]
      properties:
        code:
          type: string
          enum: [advertiser_available, budget_positive, schedule_valid, creative_present, creative_confirmed, tracking_complete]
        severity: {type: string, enum: [error, warning]}
        passed: {type: boolean}
        message: {type: string}
        repair:
          oneOf:
            - $ref: '#/components/schemas/RepairTarget'
            - type: 'null'
      additionalProperties: false
    PreflightResult:
      type: object
      required: [plan_id, plan_version, passed, blocked, checks, source, scenario, checked_at]
      properties:
        plan_id: {type: string}
        plan_version: {type: integer, minimum: 1}
        passed: {type: boolean}
        blocked: {type: boolean}
        checks:
          type: array
          items: {$ref: '#/components/schemas/PreflightCheck'}
        source: {$ref: '#/components/schemas/Source'}
        scenario: {$ref: '#/components/schemas/Scenario'}
        checked_at: {type: string, format: date-time}
      additionalProperties: false
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field: {type: string}
        reason: {type: string}
      additionalProperties: false
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details, help_url]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHENTICATED, SCOPE_REQUIRED, PROJECT_ACCESS_DENIED, RESOURCE_NOT_FOUND, VERSION_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL]
            message: {type: string}
            request_id: {type: string}
            retryable: {type: boolean}
            details:
              type: array
              items: {$ref: '#/components/schemas/FieldViolation'}
            help_url:
              oneOf:
                - {type: string, format: uri}
                - {type: 'null'}
          additionalProperties: false
      additionalProperties: false
