openapi: 3.1.0
info:
  title: cookies Creative API
  version: 0.1.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: >-
    The Creative vertical owns CreativeIntakes, CreativeTasks and content
    drafts. Organization scope comes from trusted identity and project scope is
    re-authorized from the path.
servers:
  - url: /
security:
  - cookiesAuth: []
paths:
  /api/creative/v1/projects/{project_id}/creative-intakes:
    get:
      operationId: listCreativeIntakes
      summary: List CreativeIntakes available in the scoped Project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {description: Scoped CreativeIntakes.}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
    post:
      operationId: createCreativeIntake
      summary: Create a normalized manual CreativeIntake or explicitly start one from an immutable Strategy package.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCreativeIntakeRequest'}
      responses:
        '201': {description: CreativeIntake created.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-intakes/{intake_id}:create-task:
    post:
      operationId: createCreativeTask
      summary: Create one explicitly directed image-and-text CreativeTask from a ready Intake.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/IntakeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCreativeTaskRequest'}
      responses:
        '201': {description: Image and text CreativeTask created with an initial draft.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-intakes/{intake_id}:create-video-task:
    post:
      operationId: createCreativePreRollVideoTask
      summary: Confirm an approved Strategy route and create one pre-roll video CreativeTask.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/IntakeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVideoTaskRequest'}
      responses:
        '201': {description: Video CreativeTask and immutable Strategy route snapshot created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks:
    get:
      operationId: listCreativeTasks
      summary: List CreativeTasks in the scoped Project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {description: Scoped CreativeTasks.}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:
    get:
      operationId: getCreativeTask
      summary: Get a CreativeTask with its content draft and production lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: "Task, source Intake, draft and production lineage."}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: archiveCreativeTask
      summary: Archive a CreativeTask from the active queue without deleting its draft, version, Provider or Asset lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '204': {description: CreativeTask archived.}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:draft:
    patch:
      operationId: reviseCreativeDraft
      summary: Replace the editable draft contents and create its next revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseCreativeDraftRequest'}
      responses:
        '200': {description: Next ImageTextDraft revision created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:cover-image-job:
    post:
      operationId: createCreativeCoverImageJob
      summary: Create a Provider cover-image job for a CreativeTask.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model_alias: {type: string, minLength: 1, maxLength: 255}
      responses:
        '202': {description: Provider image job created with creative task lineage.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:image-job:
    post:
      operationId: createCreativeImagePlanJob
      summary: Create one Provider job for one planned Xiaohongshu image; retries do not recreate the whole image group.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateImageJobRequest'}
      responses:
        '202': {description: Provider image job created with Creative image-plan lineage.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:video-job:
    post:
      operationId: createCreativePreRollVideoJob
      summary: Create a Provider video job through cookies.video.standard.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model_alias: {type: string, minLength: 1, maxLength: 128}
      responses:
        '202': {description: Provider video job created and registered to the CreativeTask.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:render-preroll:
    post:
      operationId: createCreativePreRollRenderJob
      summary: Compose the generated pre-roll before the authorized main video.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {description: Durable FFmpeg render job accepted.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-render-jobs/{render_job_id}:
    get:
      operationId: getCreativeRenderJob
      summary: Get a durable pre-roll render job and its output Asset reference.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/RenderJobID'}]
      responses:
        '200': {description: Render job state and immutable input/output lineage.}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:bind-image-asset:
    post:
      operationId: bindCreativeImageAsset
      summary: Bind one ready Asset version in the same Project to one planned image, creating the next Draft revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindImageAssetRequest'}
      responses:
        '200': {description: Next ImageTextDraft revision with the AssetVersionRef bound.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:freeze-version:
    post:
      operationId: freezeCreativeVersion
      summary: Freeze one draft revision into an immutable CreativeVersion.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeCreativeVersionRequest'}
      responses:
        '201': {description: Immutable CreativeVersion created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:check:
    post:
      operationId: checkCreativeVersion
      summary: Record deterministic Phase-1 delivery checks for a frozen CreativeVersion.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Checked CreativeVersion.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:approve:
    post:
      operationId: approveCreativeVersion
      summary: Approve a passing checked CreativeVersion and emit its approval event.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Approved CreativeVersion.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:deliver:
    post:
      operationId: deliverCreativeVersion
      summary: Create the stable CreativePackage for Delivery and Insights from an approved version.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Stable CreativePackage created or replayed.}, '409': {$ref: '#/components/responses/Conflict'}}
components:
  securitySchemes:
    cookiesAuth: {type: http, scheme: bearer}
  parameters:
    ProjectID: {name: project_id, in: path, required: true, schema: {type: string, minLength: 1}}
    IntakeID: {name: intake_id, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskID: {name: task_id, in: path, required: true, schema: {type: string, minLength: 1}}
    VersionID: {name: version_id, in: path, required: true, schema: {type: string, minLength: 1}}
    RenderJobID: {name: render_job_id, in: path, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
  schemas:
    CreateCreativeIntakeRequest:
      type: object
      additionalProperties: false
      required: [source, channel, objective, audience, core_message, call_to_action, concept, tone, visual_keywords, mandatory_elements, prohibited_claims]
      properties:
        source: {enum: [manual, strategy_package]}
        strategy_package:
          type: object
          additionalProperties: false
          required: [package_id, package_version, expected_content_hash]
          properties:
            package_id: {type: string, minLength: 1}
            package_version: {type: integer, minimum: 1}
            expected_content_hash: {type: string, minLength: 1}
        channel: {const: xiaohongshu}
        objective: {type: string, maxLength: 500}
        audience: {type: string, maxLength: 500}
        core_message: {type: string, maxLength: 1000}
        call_to_action: {type: string, maxLength: 300}
        concept: {type: string, maxLength: 500}
        tone: {type: array, items: {type: string}}
        visual_keywords: {type: array, items: {type: string}}
        mandatory_elements: {type: array, items: {type: string}}
        prohibited_claims: {type: array, items: {type: string}}
    CreateCreativeTaskRequest:
      type: object
      additionalProperties: false
      required: [content_type, focus]
      properties:
        content_type: {enum: [lifestyle, ingredient_explanation, usage_scenario, list_guide, comparison, custom]}
        focus: {type: string, minLength: 1, maxLength: 300}
        audience: {type: string, maxLength: 500}
        core_message: {type: string, maxLength: 1000}
        call_to_action: {type: string, maxLength: 300}
    AssetVersionRef:
      type: object
      additionalProperties: false
      required: [asset_id, version]
      properties:
        asset_id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
    CreateVideoTaskRequest:
      type: object
      additionalProperties: false
      required: [route_index, channel, source_video, concept, prompt, call_to_action, mandatory_elements, prohibited_claims, confirm_route]
      properties:
        route_index: {type: integer, minimum: 0}
        channel: {enum: [douyin, kuaishou]}
        source_video: {$ref: '#/components/schemas/AssetVersionRef'}
        concept: {type: string, minLength: 1, maxLength: 500}
        prompt: {type: string, minLength: 1, maxLength: 4000}
        call_to_action: {type: string, maxLength: 300}
        mandatory_elements: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
        prohibited_claims: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
        confirm_route: {type: boolean, const: true}
    FreezeCreativeVersionRequest:
      type: object
      additionalProperties: false
      required: [draft_version]
      properties:
        draft_version: {type: integer, minimum: 1}
        render_job_id: {type: string, minLength: 1}
    CreateImageJobRequest:
      type: object
      additionalProperties: false
      required: [image_plan_order]
      properties:
        image_plan_order: {type: integer, minimum: 1, maximum: 12}
        model_alias: {type: string, minLength: 1, maxLength: 128}
    BindImageAssetRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_version, image_plan_order, asset_ref]
      properties:
        expected_draft_version: {type: integer, minimum: 1}
        image_plan_order: {type: integer, minimum: 1, maximum: 12}
        asset_ref:
          type: object
          additionalProperties: false
          required: [asset_id, version]
          properties:
            asset_id: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
    ReviseCreativeDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_version, title_candidates, body, topics, cover_copy, image_plan]
      properties:
        expected_version: {type: integer, minimum: 1}
        title_candidates: {type: array, minItems: 3, maxItems: 8, items: {type: string, minLength: 1, maxLength: 80}}
        body: {type: string, minLength: 1, maxLength: 5000}
        topics: {type: array, maxItems: 12, items: {type: string, minLength: 1, maxLength: 80}}
        cover_copy: {type: string, minLength: 1, maxLength: 30}
        image_plan:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/ImagePlanItem'}
    ImagePlanItem:
      type: object
      additionalProperties: false
      required: [order, purpose, visual_brief, caption]
      properties:
        order: {type: integer, minimum: 1}
        purpose: {type: string, minLength: 1}
        visual_brief: {type: string, minLength: 1}
        caption: {type: string, minLength: 1}
        asset_ref:
          type: object
          additionalProperties: false
          required: [asset_id, version]
          properties:
            asset_id: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
  responses:
    InvalidRequest: {description: The request violates the Creative API contract.}
    Conflict: {description: "The resource state, scope, or idempotency key conflicts with the request."}
    NotFound: {description: The scoped resource does not exist.}
    ProjectAccessDenied: {description: The caller cannot access this Project.}
