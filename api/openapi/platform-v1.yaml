openapi: 3.1.0
info:
  title: cookies Platform API
  version: 0.2.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: >-
    Shared, business-agnostic platform APIs. Vertical systems publish their own
    contracts under /api/{system}/v1. Organization scope is resolved from
    trusted identity. Project scope comes from the path and is re-authorized.
servers:
  - url: /
    description: Current cookies platform host
security:
  - cookiesAuth: []
paths:
  /platform/v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Create an opaque HttpOnly administrator session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 255}
                password: {type: string, minLength: 1, maxLength: 4096}
              additionalProperties: false
      responses:
        '200': {description: Session created.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {description: Credential temporarily locked.}
  /platform/v1/auth/logout:
    post:
      operationId: logoutPasswordSession
      summary: Revoke the current session and expire its cookie.
      security: []
      responses:
        '204': {description: Session revoked or already absent.}
        '400': {description: The session cookie is malformed and has been expired.}
  /platform/v1/context:
    get:
      operationId: getRequestContext
      summary: Return the caller's trusted, scoped request context.
      responses:
        '200':
          description: Authenticated context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects/{project_id}/context:
    get:
      operationId: getProjectContext
      summary: Verify project access and return the scoped request context.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: The caller is authorized for the requested project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Return the current user, organization, and membership resolved from trusted identity.
      responses:
        '200':
          description: Current identity and organization membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/brands:
    post:
      operationId: createBrand
      summary: Create a brand in the caller's organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
              additionalProperties: false
      responses:
        '201':
          description: Brand created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Brand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /platform/v1/projects:
    get:
      operationId: listProjects
      summary: List projects visible to the current principal.
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Project'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      operationId: createProject
      summary: Create a draft or brand-bound active project.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /platform/v1/projects/{project_id}/knowledge/documents:
    get:
      operationId: listKnowledgeDocuments
      summary: List parsed Project documents without returning extracted content.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200': {description: Project document list.}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
    post:
      operationId: createKnowledgeDocument
      summary: Scan, store, and parse one Markdown or DOCX document.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, contentEncoding: binary}
      responses:
        '201': {description: Document parsed and stored.}
        '400': {$ref: '#/components/responses/BadRequest'}
  /platform/v1/projects/{project_id}/knowledge/research-runs:
    post:
      operationId: createExternalResearchRun
      summary: Execute one explicitly confirmed web or MCP research call.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, query, document_ids, disclosed_fields, confirmed]
              properties:
                mode: {enum: [web, mcp]}
                query: {type: string, minLength: 1, maxLength: 2000}
                document_ids: {type: array, maxItems: 20, items: {type: string}}
                disclosed_fields: {type: array, items: {type: string}}
                confirmed: {const: true}
              additionalProperties: false
      responses:
        '201': {description: Research run and any ResearchArtifacts.}
        '400': {$ref: '#/components/responses/BadRequest'}
  /platform/v1/projects/{project_id}/assets/uploads:
    post:
      operationId: createAssetUpload
      summary: Create an image upload session and a short-lived signed TOS PUT.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUploadRequest'}
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateUploadResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/projects/{project_id}/assets/uploads/{upload_id}:
    put:
      operationId: proxyAssetUpload
      summary: Local-development/fallback upload proxy; production clients use the signed PUT.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/UploadID'
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, contentEncoding: binary}}
          image/jpeg: {schema: {type: string, contentEncoding: binary}}
      responses:
        '204': {description: Upload stored in quarantine.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /platform/v1/projects/{project_id}/assets/uploads/{upload_id}:finalize:
    post:
      operationId: finalizeAssetUpload
      summary: Validate, scan, persist, and attach an uploaded image to the project.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/UploadID'
      responses:
        '200':
          description: Upload finalized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/projects/{project_id}/assets:
    get:
      operationId: listProjectAssets
      summary: List immutable asset versions attached to the project.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Project asset list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProjectAsset'}}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}:
    delete:
      operationId: removeProjectAssetVersion
      summary: Remove an immutable asset version from the project library without deleting its durable record.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - {name: asset_id, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '204':
          description: Project asset relationship removed or already absent.
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/preview:
    get:
      operationId: previewAssetVersion
      summary: Re-authorize and return a short-lived signed preview request.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - {name: asset_id, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Private no-store preview request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/content:
    get:
      operationId: streamAssetVersionContent
      summary: Stream authorized asset content when the active blob provider cannot issue an external signed URL.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - {name: asset_id, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Private no-store asset bytes.
          headers:
            Cache-Control: {schema: {type: string, example: 'private, no-store'}}
            X-Content-Type-Options: {schema: {type: string, example: nosniff}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/projects/{project_id}/model/jobs:
    post:
      operationId: createModelJob
      summary: Create an asynchronous image-generation model job.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelJobCreateRequest'
      responses:
        '202':
          description: Model job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/model/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getModelJob
      summary: Return the current public model job state.
      responses:
        '200':
          description: Current model job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/assets/generated-intakes:
    post:
      operationId: createGeneratedAssetIntake
      summary: Start admission of one provider output into the project asset library.
      description: >-
        This is the only route by which provider outputs become durable project
        assets. Assets resolves the opaque ProviderOutputRef through an injected
        provider adapter, verifies actual size, MIME and SHA-256, scans the
        bytes, and persists them asynchronously. The request hash is SHA-256 of
        the RFC 8785 JCS canonical request body. The default idempotency key is
        provider-job-{provider_job_id}-output-{output_id}.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedAssetIntakeRequest'
      responses:
        '202':
          description: The single-output intake was accepted for asynchronous processing.
          headers:
            Location:
              description: Project-scoped URL of the generated intake.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssetIntakeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/projects/{project_id}/assets/generated-intakes/{intake_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/IntakeID'
    get:
      operationId: getGeneratedAssetIntake
      summary: Return the current state of a single-output generated intake.
      responses:
        '200':
          description: Current generated intake state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssetIntakeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9_-]+$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Defaults to provider-job-{provider_job_id}-output-{output_id} for generated intake.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9_-]+$'
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IntakeID:
      name: intake_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request does not satisfy the public contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state or idempotency history.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: The request has no trusted identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectAccessDenied:
      description: The caller cannot access the requested project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RequestContext:
      type: object
      required: [request_id, trace_id, actor]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        actor:
          $ref: '#/components/schemas/ActorContext'
    ActorContext:
      type: object
      required: [organization_id, principal, scopes]
      properties:
        organization_id:
          type: string
        principal:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [user, service]
            id:
              type: string
        scopes:
          type: array
          items:
            type: string
    ModelJobCreateRequest:
      type: object
      required: [capability, input, project_context_version]
      properties:
        capability:
          type: string
          enum: [image.generate, image.edit, video.generate]
        model_alias:
          type: string
          examples: [cookies.image.standard]
        input:
          oneOf:
            - $ref: '#/components/schemas/ImageGenerationInput'
            - $ref: '#/components/schemas/VideoGenerationInput'
        project_context_version:
          type: integer
          minimum: 1
          description: Must equal the currently authorized ProjectContext version.
        constraints:
          type: object
          additionalProperties: true
        source_system:
          type: string
        source_task_id:
          type: string
      additionalProperties: false
    ImageGenerationInput:
      type: object
      required: [prompt, width, height]
      properties:
        prompt:
          type: string
          minLength: 1
          writeOnly: true
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        source_assets:
          type: array
          items: {$ref: '#/components/schemas/ProjectAssetRef'}
      additionalProperties: false
    VideoGenerationInput:
      type: object
      additionalProperties: false
      required: [prompt, duration_seconds, aspect_ratio, resolution]
      properties:
        prompt: {type: string, minLength: 1, writeOnly: true}
        duration_seconds: {type: integer, minimum: 4, maximum: 15}
        aspect_ratio: {enum: ['9:16', '16:9', '1:1']}
        resolution: {enum: [480p, 720p, 1080p]}
        audio_policy: {enum: [silent, generated_audio]}
        input_mode: {enum: [text_only, reference_image, first_last_frame]}
        conditioning_assets:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [role, reference]
            properties:
              role: {enum: [reference_image, first_frame, last_frame]}
              reference: {$ref: '#/components/schemas/ProjectAssetRef'}
    Job:
      type: object
      required:
        - id
        - kind
        - organization_id
        - status
        - progress
        - created_at
        - updated_at
        - cancellable
        - attempt_count
        - max_attempts
        - version
      properties:
        id:
          type: string
        kind:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_ref:
          deprecated: true
          description: Compatibility field for bootstrap consumers; use result_refs.
          $ref: '#/components/schemas/ResourceRef'
        result_refs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        error:
          $ref: '#/components/schemas/JobError'
        cancellable:
          type: boolean
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    ProviderJob:
      type: object
      required:
        - id
        - kind
        - organization_id
        - project_id
        - execution_status
        - provider_status
        - progress
        - project_asset_refs
        - error
        - attempt_count
        - max_attempts
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        execution_status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        provider_status:
          type: string
          enum: [submitted, running, outputs_ready, ingesting, succeeded, partially_succeeded, failed, cancelled, expired]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        project_asset_refs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssetRef'
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    JobError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      additionalProperties: false
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    GeneratedAssetIntakeRequest:
      type: object
      required: [provider_job_id, output, provenance]
      properties:
        provider_job_id:
          type: string
          minLength: 1
        output:
          $ref: '#/components/schemas/ProviderOutputRef'
        provenance:
          $ref: '#/components/schemas/GenerationProvenance'
      additionalProperties: false
    ProviderOutputRef:
      type: object
      required:
        - provider_code
        - provider_job_id
        - output_id
        - retrieval_expires_at
        - declared_mime_type
        - declared_size_bytes
      properties:
        provider_code:
          type: string
          minLength: 1
        provider_job_id:
          type: string
          minLength: 1
        output_id:
          type: string
          minLength: 1
        retrieval_expires_at:
          type: string
          format: date-time
        declared_mime_type:
          type: string
          minLength: 1
        declared_size_bytes:
          type: integer
          minimum: 1
        declared_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
      additionalProperties: false
    GenerationProvenance:
      type: object
      required:
        - capability
        - provider_code
        - model_alias
        - model_version
        - source_asset_refs
        - project_context_version
        - generated_at
      properties:
        capability:
          type: string
        provider_code:
          type: string
        model_alias:
          type: string
        model_version:
          type: string
        prompt_ref:
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
        source_asset_refs:
          type: array
          items:
            $ref: '#/components/schemas/AssetVersionRef'
        project_context_version:
          type: integer
          minimum: 1
        generated_at:
          type: string
          format: date-time
      additionalProperties: false
    GeneratedAssetIntakeResponse:
      type: object
      required: [id, provider_job_id, output_id, status, project_asset_ref, error]
      properties:
        id:
          type: string
          minLength: 1
        provider_job_id:
          type: string
          minLength: 1
        output_id:
          type: string
          minLength: 1
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        project_asset_ref:
          oneOf:
            - $ref: '#/components/schemas/ProjectAssetRef'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
      additionalProperties: false
    ProjectRef:
      type: object
      required: [organization_id, project_id, project_context_version]
      properties:
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        project_context_version:
          type: integer
          minimum: 1
      additionalProperties: false
    ProjectContext:
      type: object
      required: [organization_id, project_id, brand_id, product_ids, project_context_version]
      properties:
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        brand_id:
          type: [string, 'null']
          minLength: 1
        product_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        brand_guideline_version_id:
          type: string
          minLength: 1
        project_context_version:
          type: integer
          minimum: 1
      additionalProperties: false
    AssetVersionRef:
      type: object
      required: [asset_id, version]
      properties:
        asset_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    ProjectAssetRef:
      type: object
      required: [project_id, asset_version]
      properties:
        project_id:
          type: string
          minLength: 1
        asset_version:
          $ref: '#/components/schemas/AssetVersionRef'
      additionalProperties: false
    CurrentIdentity:
      type: object
      required: [actor, organization, user, membership]
      properties:
        actor: {$ref: '#/components/schemas/ActorContext'}
        organization: {$ref: '#/components/schemas/Organization'}
        user:
          oneOf: [{$ref: '#/components/schemas/User'}, {type: 'null'}]
        membership:
          oneOf: [{$ref: '#/components/schemas/OrganizationMembership'}, {type: 'null'}]
      additionalProperties: false
    Organization:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, suspended, archived]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    User:
      type: object
      required: [id, display_name, status, created_at, updated_at]
      properties:
        id: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, suspended, archived]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    OrganizationMembership:
      type: object
      required: [organization_id, user_id, role, status, created_at, updated_at]
      properties:
        organization_id: {type: string}
        user_id: {type: string}
        role: {type: string}
        status: {type: string, enum: [active, suspended, removed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    Brand:
      type: object
      required: [id, organization_id, name, status]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, archived]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    CreateProjectRequest:
      type: object
      required: [name, product_ids, activate]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        primary_brand_id: {type: [string, 'null']}
        product_ids: {type: array, uniqueItems: true, items: {type: string}}
        activate: {type: boolean}
      additionalProperties: false
    Project:
      type: object
      required: [id, organization_id, name, status, primary_brand_id, project_context_version]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, archived]}
        primary_brand_id: {type: [string, 'null']}
        brand_guideline_version_id: {type: string}
        project_context_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    CreateUploadRequest:
      type: object
      required: [filename, declared_mime_type, declared_size_bytes]
      properties:
        filename: {type: string, minLength: 1, maxLength: 512}
        declared_mime_type: {type: string, enum: [image/jpeg, image/png]}
        declared_size_bytes: {type: integer, minimum: 1, maximum: 20971520}
        declared_sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
      additionalProperties: false
    SignedRequest:
      type: object
      required: [url, method, headers, expires_at]
      properties:
        url: {type: string}
        method: {type: string, enum: [GET, PUT]}
        headers: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}
      additionalProperties: false
    UploadSession:
      type: object
      required: [id, organization_id, project_id, principal, status, filename, declared_mime_type, declared_size_bytes, project_context_version, project_asset_ref, expires_at, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        principal: {type: object}
        status: {type: string, enum: [created, uploaded, processing, succeeded, failed, expired]}
        filename: {type: string}
        declared_mime_type: {type: string}
        declared_size_bytes: {type: integer}
        declared_sha256: {type: [string, 'null']}
        project_context_version: {type: integer}
        project_asset_ref:
          oneOf: [{$ref: '#/components/schemas/ProjectAssetRef'}, {type: 'null'}]
        error_code: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    CreateUploadResponse:
      type: object
      required: [session, upload]
      properties:
        session: {$ref: '#/components/schemas/UploadSession'}
        upload:
          oneOf: [{$ref: '#/components/schemas/SignedRequest'}, {type: 'null'}]
      additionalProperties: false
    ProjectAsset:
      type: object
      required: [ref, asset, version, created_at]
      properties:
        ref: {$ref: '#/components/schemas/ProjectAssetRef'}
        asset: {type: object}
        version: {type: object}
        created_at: {type: string, format: date-time}
      additionalProperties: false
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - ORGANIZATION_ACCESS_DENIED
                - PROJECT_ACCESS_DENIED
                - PROJECT_NOT_ACTIVE
                - SCOPE_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - PROVIDER_JOB_NOT_READY
                - PROVIDER_OUTPUT_EXPIRED
                - PROVIDER_OUTPUT_UNAVAILABLE
                - OUTPUT_METADATA_MISMATCH
                - ASSET_CHECKSUM_MISMATCH
                - ASSET_QUARANTINED
                - ASSET_INTAKE_FAILED
                - ASSET_NOT_READY
                - RESOURCE_NOT_FOUND
                - INTERNAL
                - DEPENDENCY_UNAVAILABLE
                - IDENTITY_UNAVAILABLE
                - IDENTITY_CONTEXT_INVALID
                - INVALID_REQUEST
                - INVALID_STATE
                - BRAND_NOT_FOUND
                - PRODUCT_NOT_FOUND
                - SERVICE_UNAVAILABLE
                - PROJECT_CONTEXT_STALE
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
            help_url:
              type: [string, 'null']
