openapi: 3.1.0
info:
  title: cookies Platform API
  version: 0.2.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: >-
    Shared, business-agnostic platform APIs. Vertical systems publish their own
    contracts under /api/{system}/v1. Organization and project scope are
    resolved from trusted identity rather than caller-supplied tenant fields.
servers:
  - url: /
    description: Current cookies platform host
security:
  - cookiesAuth: []
paths:
  /platform/v1/context:
    get:
      operationId: getRequestContext
      summary: Return the caller's trusted, scoped request context.
      responses:
        '200':
          description: Authenticated context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects/{projectID}/context:
    get:
      operationId: getProjectContext
      summary: Verify project access and return the scoped request context.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: The caller is authorized for the requested project.
          content:
            application/json:
              schema:
                type: object
                required: [request_context, project_id]
                properties:
                  request_context:
                    $ref: '#/components/schemas/RequestContext'
                  project_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/model/jobs:
    post:
      operationId: createModelJob
      summary: Create an asynchronous capability-based model job.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelJobCreateRequest'
      responses:
        '202':
          description: Model job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/model/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getModelJob
      summary: Return the current public model job state.
      responses:
        '200':
          description: Current model job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/model/jobs/{job_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/JobID'
    post:
      operationId: cancelModelJob
      summary: Request cancellation of a non-terminal model job.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated model job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/assets/generated-intakes:
    post:
      operationId: admitGeneratedAssets
      summary: Admit verified provider outputs into the project asset library.
      description: >-
        This is the only route by which provider outputs become durable project
        assets. The implementation must fetch temporary URIs through an
        allow-listed provider adapter, verify size and SHA-256, scan the bytes,
        and persist them before returning ProjectAssetRefs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedAssetIntakeRequest'
      responses:
        '201':
          description: All supplied outputs were admitted as durable assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssetIntakeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9_-]+$'
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request does not satisfy the public contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state or idempotency history.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: The request has no trusted identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectAccessDenied:
      description: The caller cannot access the requested project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RequestContext:
      type: object
      required: [request_id, trace_id, actor]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        actor:
          $ref: '#/components/schemas/ActorContext'
    ActorContext:
      type: object
      required: [organization_id, principal, scopes]
      properties:
        organization_id:
          type: string
        project_id:
          type: string
        principal:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [user, service]
            id:
              type: string
        scopes:
          type: array
          items:
            type: string
    ModelJobCreateRequest:
      type: object
      required: [capability, input]
      properties:
        capability:
          type: string
          examples: [image.generate]
        model_alias:
          type: string
          examples: [cookies.image.standard]
        input:
          type: object
          additionalProperties: true
        constraints:
          type: object
          additionalProperties: true
        source_system:
          type: string
        source_task_id:
          type: string
      additionalProperties: false
    Job:
      type: object
      required:
        - id
        - kind
        - organization_id
        - status
        - progress
        - created_at
        - updated_at
        - cancellable
        - attempt_count
        - max_attempts
        - version
      properties:
        id:
          type: string
        kind:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - partially_succeeded
            - failed
            - cancelled
            - expired
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_ref:
          deprecated: true
          description: Compatibility field for bootstrap consumers; use result_refs.
          $ref: '#/components/schemas/ResourceRef'
        result_refs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        error:
          $ref: '#/components/schemas/JobError'
        cancellable:
          type: boolean
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    JobError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      additionalProperties: false
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    GeneratedAssetIntakeRequest:
      type: object
      required: [provider_job_id, outputs, provenance]
      properties:
        provider_job_id:
          type: string
          minLength: 1
        outputs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GeneratedOutput'
        provenance:
          $ref: '#/components/schemas/GenerationProvenance'
      additionalProperties: false
    GeneratedOutput:
      type: object
      required:
        - output_id
        - temporary_uri
        - temporary_until
        - media_type
        - size_bytes
        - sha256
      properties:
        output_id:
          type: string
          minLength: 1
        temporary_uri:
          type: string
          pattern: '^(https|provider)://'
        temporary_until:
          type: string
          format: date-time
        media_type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
      additionalProperties: false
    GenerationProvenance:
      type: object
      required:
        - capability
        - provider_code
        - model_alias
        - model_version
        - generated_at
      properties:
        capability:
          type: string
        provider_code:
          type: string
        model_alias:
          type: string
        model_version:
          type: string
        prompt_ref:
          $ref: '#/components/schemas/ResourceRef'
        source_asset_refs:
          type: array
          items:
            $ref: '#/components/schemas/AssetVersionRef'
        generated_at:
          type: string
          format: date-time
      additionalProperties: false
    GeneratedAssetIntakeResponse:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProjectAssetRef'
      additionalProperties: false
    AssetVersionRef:
      type: object
      required: [asset_id, version]
      properties:
        asset_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    ProjectAssetRef:
      type: object
      required: [project_id, asset_version]
      properties:
        project_id:
          type: string
          minLength: 1
        asset_version:
          $ref: '#/components/schemas/AssetVersionRef'
      additionalProperties: false
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
            help_url:
              type: [string, 'null']
