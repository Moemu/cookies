name: cookies-test

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cookies
      MYSQL_USER: cookies
      MYSQL_PASSWORD: ${COOKIES_MYSQL_PASSWORD:?set COOKIES_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${COOKIES_MYSQL_ROOT_PASSWORD:?set COOKIES_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${COOKIES_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucookies -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    image: 127.0.0.1:5000/cookies-api:${COOKIES_IMAGE_TAG:-test-latest}
    build:
      context: ../..
      dockerfile: deployments/test/api.Dockerfile
    environment:
      COOKIES_ENV: local
      COOKIES_HTTP_ADDR: :18080
      COOKIES_MYSQL_DSN: cookies:${COOKIES_MYSQL_PASSWORD}@tcp(mysql:3306)/cookies?parseTime=true&multiStatements=true
      COOKIES_BLOB_PROVIDER: ${COOKIES_BLOB_PROVIDER:-filesystem}
      COOKIES_FILESYSTEM_BLOB_ROOT: /var/lib/cookies/blobs
      COOKIES_TOS_ENDPOINT: ${COOKIES_TOS_ENDPOINT:-}
      COOKIES_TOS_REGION: ${COOKIES_TOS_REGION:-}
      COOKIES_TOS_ACCESS_KEY: ${COOKIES_TOS_ACCESS_KEY:-}
      COOKIES_TOS_SECRET_KEY: ${COOKIES_TOS_SECRET_KEY:-}
      COOKIES_TOS_SECURITY_TOKEN: ${COOKIES_TOS_SECURITY_TOKEN:-}
      COOKIES_TOS_BUCKET: ${COOKIES_TOS_BUCKET:-}
      COOKIES_TOS_ASSETS_BUCKET: ${COOKIES_TOS_BUCKET:-}
      COOKIES_TOS_QUARANTINE_BUCKET: ${COOKIES_TOS_BUCKET:-}
      COOKIES_SCANNER_MODE: noop
      COOKIES_PASSWORD_AUTH_ENABLED: "true"
      COOKIES_ADMIN_USERNAME: ${COOKIES_ADMIN_USERNAME:-Admin}
      COOKIES_ADMIN_PASSWORD: ${COOKIES_ADMIN_PASSWORD:?set COOKIES_ADMIN_PASSWORD}
      COOKIES_SESSION_HOURS: "8"
      COOKIES_LOCAL_ORGANIZATION_ID: org_local
      COOKIES_LOCAL_PRINCIPAL_KIND: user
      COOKIES_LOCAL_PRINCIPAL_ID: user_local
      COOKIES_LOCAL_PROJECT_ID: project_local
      COOKIES_LOCAL_SCOPES: project.read,project.write,assets.read,assets.write,provider.job.create,provider.text.generate,provider.vision.understand,creative.read,creative.write,strategy.read,strategy.write,strategy.confirm,strategy.review,strategy.approve,strategy.package.read,delivery.read,delivery.write,delivery.approve,delivery.execute,insights.read,insights.write,insights.confirm
      COOKIES_PROVIDER_IMAGE_ADAPTER: ${COOKIES_PROVIDER_IMAGE_ADAPTER:-fake}
      COOKIES_PROVIDER_VIDEO_ADAPTER: ${COOKIES_PROVIDER_VIDEO_ADAPTER:-fake}
      COOKIES_PROVIDER_TEXT_ADAPTER: ${COOKIES_PROVIDER_TEXT_ADAPTER:-fake}
      COOKIES_PROVIDER_MASTER_KEY: ${COOKIES_PROVIDER_MASTER_KEY:-}
      COOKIES_PROVIDER_MASTER_KEY_VERSION: ${COOKIES_PROVIDER_MASTER_KEY_VERSION:-v1}
      COOKIES_PROVIDER_ALLOW_INSECURE_HTTP: ${COOKIES_PROVIDER_ALLOW_INSECURE_HTTP:-false}
      COOKIES_PROVIDER_OUTPUT_BUCKET: ${COOKIES_TOS_BUCKET:-cookies-provider-output}
      COOKIES_STRATEGY_ENABLED: "true"
      COOKIES_STRATEGY_V2_ENABLED: "true"
      COOKIES_STRATEGY_REAL_PROVIDER_ENABLED: ${COOKIES_STRATEGY_REAL_PROVIDER_ENABLED:-false}
      COOKIES_STRATEGY_APPROVE_ENABLED: "true"
      COOKIES_STRATEGY_PACKAGE_TO_CREATIVE_ENABLED: "true"
      COOKIES_STRATEGY_TEXT_MODEL_ALIAS: ${COOKIES_STRATEGY_TEXT_MODEL_ALIAS:-cookies.text.standard}
      COOKIES_STRATEGY_LITE_TEXT_MODEL_ALIAS: ${COOKIES_STRATEGY_LITE_TEXT_MODEL_ALIAS:-cookies.text.lite}
      COOKIES_STRATEGY_DEEP_REVIEW_MODEL_ALIAS: ${COOKIES_STRATEGY_DEEP_REVIEW_MODEL_ALIAS:-cookies.text.deep_review}
      COOKIES_STRATEGY_PROMPT_VERSION: strategy.generate.v4
      COOKIES_STRATEGY_CONVERSATION_PROMPT_VERSION: strategy.conversation.v4
      COOKIES_STRATEGY_REVISE_PROMPT_VERSION: strategy.revise.v3
      COOKIES_STRATEGY_REVIEW_PROMPT_VERSION: strategy.review.deep.v2
      COOKIES_STRATEGY_REPAIR_PROMPT_VERSION: strategy.repair.v2
      COOKIES_STRATEGY_CRITIC_ENABLED: "true"
      COOKIES_STRATEGY_CONTEXT_SELECTION_ENABLED: "true"
      COOKIES_RESEARCH_SEED_ENABLED: ${COOKIES_RESEARCH_SEED_ENABLED:-false}
      COOKIES_RESEARCH_SEED_MODEL_ALIAS: ${COOKIES_RESEARCH_SEED_MODEL_ALIAS:-cookies.research.web.standard}
      COOKIES_RESEARCH_TIKA_ENABLED: ${COOKIES_RESEARCH_TIKA_ENABLED:-false}
      COOKIES_RESEARCH_TIKA_BASE_URL: ${COOKIES_RESEARCH_TIKA_BASE_URL:-http://tika:9998}
      COOKIES_RESEARCH_TIKA_VERSION: ${COOKIES_RESEARCH_TIKA_VERSION:-3.2.3.0}
      COOKIES_RESEARCH_TIKA_TIMEOUT_SECONDS: ${COOKIES_RESEARCH_TIKA_TIMEOUT_SECONDS:-120}
      COOKIES_RESEARCH_TIKA_MAX_OUTPUT_BYTES: ${COOKIES_RESEARCH_TIKA_MAX_OUTPUT_BYTES:-20971520}
      COOKIES_DOCUMENT_VISION_ENABLED: ${COOKIES_DOCUMENT_VISION_ENABLED:-false}
      COOKIES_DOCUMENT_VISION_MODEL_ALIAS: ${COOKIES_DOCUMENT_VISION_MODEL_ALIAS:-cookies.document.vision.standard}
      COOKIES_DOCUMENT_CONVERTER_ENABLED: ${COOKIES_DOCUMENT_CONVERTER_ENABLED:-false}
      # 镜像里装了 ffmpeg，路径写死不靠 PATH 查找：查找只在 local/test 环境生效，
      # 以后把 COOKIES_ENV 改掉，视频探测会静悄悄地退回「探不出来」。
      COOKIES_FFMPEG_PATH: ${COOKIES_FFMPEG_PATH:-/usr/bin/ffmpeg}
      COOKIES_FFPROBE_PATH: ${COOKIES_FFPROBE_PATH:-/usr/bin/ffprobe}
      # 米云素材（同步自上游）。默认关：一旦打开，服务启动时就要求主密钥合法、
      # ffprobe 在位，缺一个直接退出，会把整个后端连带现有功能一起带下去。
      COOKIES_MIYUN_ENABLED: ${COOKIES_MIYUN_ENABLED:-false}
      COOKIES_MIYUN_ENDPOINT: ${COOKIES_MIYUN_ENDPOINT:-}
      COOKIES_MIYUN_MASTER_KEY: ${COOKIES_MIYUN_MASTER_KEY:-}
      COOKIES_MIYUN_MASTER_KEY_VERSION: ${COOKIES_MIYUN_MASTER_KEY_VERSION:-v1}
      COOKIES_MIYUN_DOWNLOAD_ALLOWED_HOSTS: ${COOKIES_MIYUN_DOWNLOAD_ALLOWED_HOSTS:-}
      COOKIES_MIYUN_MAX_CONCURRENT: ${COOKIES_MIYUN_MAX_CONCURRENT:-1}
      COOKIES_MIYUN_REQUESTS_PER_SECOND: ${COOKIES_MIYUN_REQUESTS_PER_SECOND:-5}
      COOKIES_MIYUN_COOLDOWN_SECONDS: ${COOKIES_MIYUN_COOLDOWN_SECONDS:-300}
    expose:
      - "18080"
    volumes:
      - blob-data:/var/lib/cookies/blobs
    depends_on:
      mysql:
        condition: service_healthy
      tika:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tika:
    image: apache/tika:3.2.3.0
    restart: unless-stopped

  web:
    image: 127.0.0.1:5000/cookies-web:${COOKIES_IMAGE_TAG:-test-latest}
    build:
      context: ../..
      dockerfile: deployments/test/web.Dockerfile
    ports:
      - "0.0.0.0:${COOKIES_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  blob-data:
