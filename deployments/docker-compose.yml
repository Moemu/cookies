services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${COOKIES_MYSQL_DATABASE:-cookies}
      MYSQL_USER: ${COOKIES_MYSQL_USER:-cookies}
      MYSQL_PASSWORD: ${COOKIES_MYSQL_PASSWORD:-cookies_local_development_only}
      MYSQL_ROOT_PASSWORD: ${COOKIES_MYSQL_ROOT_PASSWORD:-root_local_development_only}
    ports:
      - "${COOKIES_MYSQL_BIND_ADDRESS:-127.0.0.1}:${COOKIES_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  tika:
    image: apache/tika:3.2.3.0
    restart: unless-stopped
    ports:
      - "${COOKIES_TIKA_BIND_ADDRESS:-127.0.0.1}:${COOKIES_TIKA_PORT:-9998}:9998"

volumes:
  mysql-data:
