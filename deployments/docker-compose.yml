services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COOKIES_POSTGRES_DB:-cookies}
      POSTGRES_USER: ${COOKIES_POSTGRES_USER:-cookies}
      POSTGRES_PASSWORD: ${COOKIES_POSTGRES_PASSWORD:-cookies_local_development_only}
    ports:
      - "${COOKIES_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${COOKIES_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
